{% extends 'panel/base.html' %}
{% block content %}<div class="d-flex justify-content-between mb-3"><h1 class="h4">کاربران</h1><form class="d-flex gap-2"><input name="q" value="{{ q }}" class="form-control form-control-sm" placeholder="موبایل یا نام"><button class="btn btn-sm btn-primary">جستجو</button></form></div>
<div class="card"><div class="table-responsive"><table class="table mb-0 align-middle"><thead><tr><th>نام</th><th>موبایل</th><th>سفارش</th><th>عضویت</th><th>نقش / رمز عبور</th></tr></thead>
{% for u in users %}<tr><td>{{ u.name }}</td><td dir="ltr" class="text-end">{{ u.mobile }}</td><td>{{ u.orders_count|fa }}</td><td>{{ u.created_at|jdate:'date' }}</td>
<td><form method="post" action="{% url 'panel_user_update' u.id %}" class="d-flex gap-2">{% csrf_token %}<select name="role" class="form-select form-select-sm" style="width:110px"><option value="customer" {% if u.role == 'customer' %}selected{% endif %}>کاربر</option><option value="admin" {% if u.role == 'admin' %}selected{% endif %}>مدیر</option></select>
<input name="password" class="form-control form-control-sm" placeholder="رمز جدید (مدیر)" dir="ltr" style="width:150px"><button class="btn btn-sm btn-outline-primary">ذخیره</button></form></td></tr>{% endfor %}
</table></div></div>{% endblock %}
