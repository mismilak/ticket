{% extends 'base.html' %}
{% block content %}<div class="container"><div class="card auth-card text-center"><div class="card-body p-4">
    <div class="badge bg-warning text-dark mb-2">درگاه آزمایشی — فقط برای تست</div><h1 class="h5">پرداخت {{ payment.amount|price }}</h1><p class="text-muted small">سفارش {{ payment.order.code }}</p>
    <a class="btn btn-success w-100 mb-2" href="{% url 'payment_callback' payment.id %}?result=ok">پرداخت موفق</a>
    <a class="btn btn-outline-danger w-100" href="{% url 'payment_callback' payment.id %}?result=fail">انصراف / ناموفق</a></div></div></div>{% endblock %}
